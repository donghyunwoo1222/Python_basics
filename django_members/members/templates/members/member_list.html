<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 목록 관리</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --border-color: #E2E8F0;
            --hover-bg: #F1F5F9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            padding: 28px;
            border: 1px solid var(--border-color);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid var(--border-color);
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .badge {
            background-color: #EEF2FF;
            color: var(--primary-color);
            font-size: 0.875rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: #F8FAFC;
            color: var(--text-sub);
            font-size: 0.85rem;
            font-weight: 600;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px;
            font-size: 0.95rem;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-color);
        }

        tbody tr {
            transition: background-color 0.15s ease;
        }

        tbody tr:hover {
            background-color: var(--hover-bg);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .id-col {
            font-weight: 600;
            color: var(--primary-color);
        }

        .empty-state {
            text-align: center;
            padding: 40px 0;
            color: var(--text-sub);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>회원 목록</h1>
            <span class="badge">총 {{ members|length }}명</span>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>회원 ID</th>
                        <th>이름</th>
                        <th>이메일</th>
                        <th>나이</th>
                        <th>가입일시</th>
                    </tr>
                </thead>
                <tbody>
                    {% for member in members %}
                    <tr>
                        <td class="id-col">#{{ member.member_id }}</td>
                        <td><strong>{{ member.name }}</strong></td>
                        <td>{{ member.email }}</td>
                        <td>{{ member.age|default:"-" }}{% if member.age %}세{% endif %}</td>
                        <td>{{ member.created_at|date:"Y-m-d H:i" }}</td>
                    </tr>
                    {% empty %}
                    <tr>
                        <td colspan="5" class="empty-state">
                            등록된 회원이 없습니다.
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

</body>
</html>
